<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Agent - 智能工单系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ms: {
                            blue: '#0078D4', dark: '#005A9E', light: '#E5F1FB', bg: '#F3F6F8',
                            surface: '#FFFFFF', text: '#323130', muted: '#605E5C', border: '#E1DFDD',
                            success: '#107C10', warning: '#FFB900', danger: '#D13438', info: '#0078D4'
                        }
                    },
                    fontFamily: { 'segoe': ['Segoe UI', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-ms-bg text-ms-text font-segoe min-h-screen">

    <!-- 顶部导航 -->
    <header class="bg-ms-blue text-white h-14 flex items-center px-6 fixed top-0 left-0 right-0 z-50 shadow-md">
        <div class="flex items-center gap-3">
            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
            </svg>
            <span class="font-semibold text-lg tracking-tight">Support Agent</span>
        </div>
        <div class="flex-1 max-w-2xl mx-8">
            <div class="relative">
                <input id="globalSearch" type="text" placeholder="搜索工单、知识库、用户..."
                    class="w-full bg-white/15 border border-white/20 rounded-lg pl-10 pr-4 py-2 text-sm text-white placeholder-white/60 focus:outline-none focus:bg-white/20 focus:border-white/40 transition-all">
                <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-white/60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button class="relative p-2 hover:bg-white/10 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                <span class="absolute top-1 right-1 w-2 h-2 bg-ms-warning rounded-full"></span>
            </button>
            <div class="flex items-center gap-3">
                <div class="avatar w-8 h-8 text-sm" style="background:#7F5BC8">林</div>
                <span class="text-sm font-medium">林晓薇</span>
            </div>
        </div>
    </header>

    <div class="flex pt-14 min-h-screen">
        <!-- 左侧边栏 -->
        <aside class="w-60 bg-[#252423] text-white flex-shrink-0 fixed left-0 top-14 bottom-0 overflow-y-auto">
            <nav class="py-4">
                <div class="px-4 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">工作台</div>
                <a href="#" data-view="dashboard" class="sidebar-item active flex items-center gap-3 px-4 py-2.5 text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    智能工单看板
                </a>
                <a href="#" data-view="tickets" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    全部工单
                </a>
                <a href="#" data-view="agent" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    自动处理中心
                </a>
                <div class="px-4 mt-6 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">管理</div>
                <a href="#" data-view="team" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/></svg>
                    团队管理
                </a>
                <a href="#" data-view="analytics" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    数据分析
                </a>
                <a href="#" data-view="settings" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    系统设置
                </a>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-1 ml-60 p-8">
            <!-- 看板 -->
            <section id="view-dashboard" class="view active"></section>
            <!-- 全部工单 -->
            <section id="view-tickets" class="view"></section>
            <!-- 自动处理中心 -->
            <section id="view-agent" class="view"></section>
            <!-- 团队管理 -->
            <section id="view-team" class="view"></section>
            <!-- 数据分析 -->
            <section id="view-analytics" class="view"></section>
            <!-- 系统设置 -->
            <section id="view-settings" class="view"></section>
        </main>
    </div>

    <div id="toast" class="toast"></div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
